# Run everything locally: docker compose up --build, then open http://localhost:8080
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthswitch
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]   # management UI: http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/healthswitch?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PROCESSOR_WEBHOOK_SECRET: local-dev-secret
      # DEMO_ACCESS_KEY: choose-a-key   # uncomment to require a key in the browser
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
